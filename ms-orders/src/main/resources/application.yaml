spring:
  application:
    name: ms-orders

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  threads:
    virtual:
      enabled: true

server:
  port: ${SERVER_PORT:8084}

  shutdown: graceful

spring.lifecycle:
  timeout-per-shutdown-phase: 30s

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized

  info:
    env:
      enabled: false

info:
  app:
    name: ${spring.application.name}
    description: Microservicio de gestión de órdenes de Pedidos360

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html